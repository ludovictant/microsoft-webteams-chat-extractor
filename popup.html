<!doctype html>
<html>
<head>
	<title>MS Teams Chat Transcript</title>
	<script src="popup.js"></script>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			font-size: 14px;
			line-height: 1.5;
			color: #e0e0e0;
			background-color: #1e1e2e;
			width: 380px;
		}

		/* ---- Header ---- */
		.header {
			background: #2b2b3d;
			padding: 14px 16px;
			border-bottom: 1px solid #3a3a52;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.header img {
			width: 24px;
			height: 24px;
		}

		.header h1 {
			font-size: 15px;
			font-weight: 600;
			color: #fff;
		}

		/* ---- Options panel ---- */
		#options {
			padding: 16px;
		}

		#options .section-label {
			font-size: 12px;
			font-weight: 600;
			color: #8888a8;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin-bottom: 8px;
		}

		#options .btn-group {
			display: flex;
			flex-direction: column;
			gap: 4px;
			margin-bottom: 16px;
		}

		#options button {
			display: block;
			width: 100%;
			padding: 10px 14px;
			border: 1px solid #3a3a52;
			border-radius: 8px;
			background: #2b2b3d;
			color: #e0e0e0;
			font-size: 14px;
			font-family: inherit;
			cursor: pointer;
			text-align: left;
			transition: background 0.15s, border-color 0.15s;
		}

		#options button:hover {
			background: #35354d;
			border-color: #6264a7;
		}

		/* ---- Sort toggle ---- */
		.sort-group {
			display: flex;
			background: #2b2b3d;
			border: 1px solid #3a3a52;
			border-radius: 8px;
			overflow: hidden;
		}

		.sort-group label {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 8px 0;
			font-size: 13px;
			color: #8888a8;
			cursor: pointer;
			transition: background 0.15s, color 0.15s;
			gap: 6px;
		}

		.sort-group label:first-child {
			border-right: 1px solid #3a3a52;
		}

		.sort-group input[type="radio"] {
			display: none;
		}

		.sort-group input[type="radio"]:checked + span {
			color: #fff;
		}

		.sort-group label:has(input:checked) {
			background: #3a3a56;
			color: #fff;
		}

		/* ---- Status / spinner ---- */
		#status {
			padding: 40px 16px;
			text-align: center;
			color: #8888a8;
		}

		#status .spinner {
			display: inline-block;
			width: 24px;
			height: 24px;
			border: 3px solid #3a3a52;
			border-top-color: #6264a7;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin-bottom: 12px;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		#status p {
			font-size: 13px;
		}

		/* ---- Progress Bar ---- */
		.progress-container {
			width: 100%;
			height: 6px;
			background-color: #3a3a52;
			border-radius: 3px;
			margin: 12px 0;
			overflow: hidden;
			display: none;
		}

		.progress-bar {
			height: 100%;
			background-color: #6264a7;
			width: 0%;
			transition: width 0.3s ease;
		}

		.progress-bar.indeterminate {
			width: 30%;
			animation: indeterminate 1.5s infinite linear;
		}

		@keyframes indeterminate {
			from { transform: translateX(-100%); }
			to { transform: translateX(350%); }
		}

		#dateDepth {
			font-size: 12px;
			color: #8888a8;
			margin-bottom: 8px;
			display: none;
		}

		/* ---- Final state ---- */
		#finalActions {
			padding: 40px 16px;
			text-align: center;
		}

		#finalActions h2 {
			font-size: 18px;
			color: #fff;
			margin-bottom: 10px;
		}

		#downloadZipBtn {
			background: #6264a7;
			color: white;
			border: none;
			padding: 12px 24px;
			border-radius: 8px;
			cursor: pointer;
			font-size: 14px;
			font-weight: 600;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			margin: 0 auto;
			transition: background 0.15s;
		}

		#downloadZipBtn:hover {
			background: #7b7db7;
		}

		#downloadZipBtn svg {
			width: 18px;
			height: 18px;
			fill: none;
			stroke: currentColor;
			stroke-width: 2;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		.footer {
			padding: 8px 16px;
			border-top: 1px solid #3a3a52;
			background: #2b2b3d;
			color: #8888a8;
			font-size: 11px;
			text-align: right;
		}

		.toast {
			position: fixed;
			bottom: 40px;
			left: 50%;
			transform: translateX(-50%);
			background: #81c784;
			color: #1b5e20;
			padding: 4px 12px;
			border-radius: 4px;
			font-size: 12px;
			opacity: 0;
			transition: opacity 0.3s;
			pointer-events: none;
		}

		.toast.show {
			opacity: 1;
		}
	</style>
</head>

<body>
	<div class="header">
		<img src="icons/chat-32.png" alt="">
		<h1 id="title">Chat Transcript</h1>
	</div>

	<div id="options">
		<div class="section-label">Time range</div>
		<div class="btn-group">
			<button data-days="-1">Currently loaded messages</button>
			<button data-days="1">Last 24 hours</button>
			<button data-days="7">Last 7 days</button>
			<button data-days="30">Last 30 days</button>
			<button data-days="90">Last 3 months</button>
			<button data-days="0">All messages</button>
		</div>
		<div class="section-label">Sort order</div>
		<div class="sort-group">
			<label>
				<input type="radio" name="sort" value="oldest" checked>
				<span>Oldest first</span>
			</label>
			<label>
				<input type="radio" name="sort" value="newest">
				<span>Newest first</span>
			</label>
		</div>
	</div>

	<div id="status" style="display:none;">
		<div class="spinner"></div>
		<p id="rangeText" style="font-weight: 600; color: #fff; margin-bottom: 4px;"></p>
		<div id="progressBarContainer" class="progress-container">
			<div id="progressBar" class="progress-bar"></div>
		</div>
		<p id="dateDepth"></p>
		<p id="progressText" style="margin-bottom: 16px;">Loading...</p>
		<button id="stopBtn" style="background: #d32f2f; color: white; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 12px;">Stop Extraction</button>
	</div>

	<div id="finalActions" style="display:none;">
		<h2 id="finalTitle">Ready!</h2>
		<p id="finalMsg" style="margin-bottom: 20px; color: #8888a8; font-size: 13px;"></p>
		<button id="downloadZipBtn">
			<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
			Download Archive (ZIP)
		</button>
	</div>

	<div id="toast" class="toast">Downloaded!</div>

	<div class="footer">
		v<span id="versionNumber"></span>
	</div>
</body>
</html>
